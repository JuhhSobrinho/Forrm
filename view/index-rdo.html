        <style>
            /* ================================================
               RDO — estilos exclusivos desta página
               Não interferem em index.html / index-reparo.html
               ================================================ */

            /* Scroll horizontal no card quando a tela for estreita */
            .rdo-card-body {
                overflow-x: auto;
                padding: 0.75rem 1rem;
            }

            /* Impede que as colunas quebrem para a linha de baixo */
            .rdo-escopo-row,
            .rdo-horas-row {
                flex-wrap: nowrap;
            }

            /* Largura mínima garante que os inputs tenham espaço suficiente */
            .rdo-escopo-row { min-width: 660px; }
            .rdo-horas-row  { min-width: 820px; }

            /* Inputs de hora ficam estreitos em col-1; garante largura mínima */
            .rdo-horas-row input[type="time"] {
                min-width: 90px;
            }
